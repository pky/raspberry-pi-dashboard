[tool:pytest]
# pytest設定ファイル
testpaths = tests/unit tests/integration tests/e2e
python_files = test_*.py *_test.py
python_classes = Test*
python_functions = test_*
addopts = 
    -v
    --tb=short
    --cov=.
    --cov-report=html:reports/coverage
    --cov-report=term
    --cov-exclude=tests/*
    --cov-exclude=.venv/*
    --cov-exclude=.*
    --strict-markers
filterwarnings =
    ignore::pytest.PytestUnknownMarkWarning

# テストマーカー定義
markers =
    unit: ハードウェア非依存の単体テスト
    integration: ハードウェア依存の統合テスト
    slow: 実行に時間がかかるテスト
    api: API関連のテスト
    sensor: センサー関連のテスト
    database: データベース関連のテスト